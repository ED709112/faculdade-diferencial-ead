<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em construção - Faculdade Diferencial</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a2a6c 0%, #1a56db 45%, #1a5fd0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 560px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(8px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .logo span { color: #ffd166; }
    .badge {
      display: inline-block;
      margin: 20px 0 16px;
      padding: 8px 18px;
      background: #ffd166;
      color: #1a2a6c;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 50px;
    }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 14px; }
    p { font-size: 16px; line-height: 1.7; opacity: 0.92; margin-bottom: 28px; }
    .icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
    }
    .icon svg { width: 44px; height: 44px; }
    .footer { font-size: 13px; opacity: 0.65; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Faculdade <span>Diferencial</span></div>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
      </svg>
    </div>
    <div class="badge">Em construção</div>
    <h1>Nosso novo site está chegando!</h1>
    <p>Estamos preparando um espaço totalmente novo para você.
       Em breve, informações sobre nossos cursos, matrículas e muito mais estarão disponíveis aqui.</p>
    <p class="footer">&copy; 2026 Faculdade Diferencial EAD &mdash; Todos os direitos reservados</p>
  </div>
</body>
</html>
